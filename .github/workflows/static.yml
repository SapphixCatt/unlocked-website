name: Deploy Main Site and 50 Sub-Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Sync All Sites
        run: |
          # 1. Prepare deployment directory
          mkdir -p _site
          
          # 2. Copy all files from root to _site, excluding metadata folders
          # We explicitly copy known file types to avoid infinite recursive loops
          cp -r index.html style.css script.js *.png *.jpg *.jpeg *.js *.css _site/ 2>/dev/null || true
          
          # 3. Generate sub-sites
          for i in {1..50}; do
            mkdir -p "_site/$i"
            
            # 4. Copy files into the specific sub-folder
            cp -r _site/* "_site/$i/" 2>/dev/null || true
            
            # 5. Prevent sub-sites from being copied into themselves
            rm -rf "_site/$i/$i"
          done

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
