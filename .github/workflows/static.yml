name: Deploy Main Site and 50 Sub-Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Sync All Sites
        run: |
          # Create a clean deployment folder
          mkdir -p public
          
          # Copy only the files we want, excluding the folders we don't need
          # This prevents the "infinite loop" error that causes Error 1
          find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '.github' -not -name 'public' -exec cp -r {} public/ \;
          
          # Create 50 numbered sub-folders
          for i in {1..50}; do
            mkdir -p "public/$i"
            # Copy your main index.html into each sub-folder
            # We assume your main page is index.html
            if [ -f "index.html" ]; then
              cp index.html "public/$i/index.html"
            fi
            # If you have a style.css, copy that too
            if [ -f "style.css" ]; then
              cp style.css "public/$i/style.css"
            fi
          done

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
