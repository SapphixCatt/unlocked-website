name: Deploy Main Site and 50 Sub-Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Copy Files
        run: |
          mkdir -p _site
          
          # List all files you want in every sub-site here
          # You can add more names like 'about.html' or 'script.js' inside the quotes
          files_to_copy=("index.html" "style.css" "script.js" "main.js" "logo.png")
          
          # 1. Copy files to the main root of _site
          for file in "${files_to_copy[@]}"; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
          
          # 2. Create folders 1-50 and copy files into each
          for i in {1..50}; do
            mkdir -p "_site/$i"
            for file in "${files_to_copy[@]}"; do
              if [ -f "$file" ]; then cp "$file" "_site/$i/"; fi
            done
          done

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
