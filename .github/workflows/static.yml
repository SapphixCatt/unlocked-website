name: Deploy Main Site and 50 Sub-Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Repair Paths
        run: |
          # 1. Create a clean staging directory
          mkdir -p build_stage
          
          # 2. Copy root files to a temporary location first (avoids recursive copies)
          # We explicitly copy known files to avoid grabbing the _site or build folders
          cp -r index.html style.css script.js build_stage/ 2>/dev/null || true
          # If you have an images folder:
          if [ -d "images" ]; then cp -r images build_stage/; fi
          
          # 3. Create the final deployment site
          mkdir -p _site
          cp -r build_stage/* _site/
          
          # 4. Generate 50 folders
          for i in {1..50}; do
            mkdir -p "_site/$i"
            cp -r build_stage/* "_site/$i/"
            
            # 5. Fix paths only if the file exists
            if [ -f "_site/$i/index.html" ]; then
              sed -i 's|href="/|href="|g' "_site/$i/index.html"
              sed -i 's|src="/|src="|g' "_site/$i/index.html"
            fi
          done

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
