name: Generate and Deploy 50 Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps:deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy root files and generate 1-50
        run: |
          mkdir -p _site
          # Copy your existing repository files into the deployment folder
          cp -r * _site/ 2>/dev/null || true
          rm -rf _site/_site # Prevents infinite recursion
          
          # Generate the 50 separate folders
          for i in {1..50}; do
            mkdir -p _site/$i
            echo "<!DOCTYPE html><html><head><title>Site $i</title></head><body><h1>Welcome to Site $i</h1></body></html>" > _site/$i/index.html
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/actions-deploy-pages@v4
