name: Deploy Main Site and 50 Sub-Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Sites
        run: |
          mkdir -p _site
          # Copy everything from current folder to _site, excluding hidden git/action files
          cp -r index.html style.css script.js _site/ 2>/dev/null || true
          
          # Create exactly 50 folders and copy assets into each
          for i in {1..50}; do
            mkdir -p "_site/$i"
            cp index.html "_site/$i/index.html"
            cp style.css "_site/$i/style.css" 2>/dev/null || true
            cp script.js "_site/$i/script.js" 2>/dev/null || true
          done

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
