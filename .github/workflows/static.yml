name: Deploy Main Site and 50 Sub-Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Deployment Structure
        run: |
          # 1. Create the base directory
          mkdir -p public
          
          # 2. Move existing files into public, ignoring hidden git/workflow folders
          find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '.github' -not -name 'public' -exec cp -r {} public/ \;
          
          # 3. Create folders 1-50
          for i in {1..50}; do
            mkdir -p "public/$i"
            
            # 4. Create symbolic links for all files in the root
            # This makes all your main files "appear" inside the sub-folders
            # without actually duplicating them (prevents memory errors)
            cd "public/$i"
            find .. -maxdepth 1 -not -name '.' -not -name '..' -exec ln -s {} . \;
            cd ../..
          done

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
