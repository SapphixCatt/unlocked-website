name: Deploy Main Site and 50 Sub-Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Repair Paths
        run: |
          mkdir -p _site
          
          # Copy everything into _site
          cp -r . _site/
          rm -rf _site/.git _site/.github _site/_site

          # Create 50 folders and copy files into them
          for i in {1..50}; do
            mkdir -p "_site/$i"
            cp -r ./* "_site/$i/" 2>/dev/null || true
            
            # REMOVE the leading slash from paths in index.html for this sub-site
            # This turns href="/style.css" into href="style.css" so it works in sub-folders
            sed -i 's|href="/|href="|g' "_site/$i/index.html"
            sed -i 's|src="/|src="|g' "_site/$i/index.html"
          done

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
