name: Deploy Main Site and 50 Sub-Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Sync All Sites
        run: |
          # Create the final directory structure
          mkdir -p _site
          
          # 1. Copy all original files to the root of _site (This handles your main site)
          cp -R . _site/
          
          # 2. Remove the _site folder from inside _site to avoid infinite loops
          rm -rf _site/_site
          
          # 3. Create folders 1-50 and copy the full site content into each
          for i in {1..50}; do
            mkdir -p "_site/$i"
            cp -R . "_site/$i/"
            # Remove the nested _site folder within each numbered directory
            rm -rf "_site/$i/_site"
            # Remove the workflow file to keep it clean
            rm -rf "_site/$i/.github"
          done

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
