name: Deploy Main Site and 50 Sub-Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Sync All Sites
        run: |
          mkdir -p _deploy_workspace
          
          # Copy everything from root to the workspace
          rsync -av --exclude='.git*' --exclude='_deploy_workspace' ./ _deploy_workspace/
          
          # Generate folders 1-50 and replicate the full site inside each
          for i in {1..50}; do
            mkdir -p "_deploy_workspace/$i"
            # Copy all files into the numbered folder
            rsync -av --exclude='.git*' --exclude='_deploy_workspace' ./ "_deploy_workspace/$i/"
          done

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy_workspace'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
