name: Deploy Main Site and 50 Sub-Sites

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build 50 Independent Sites
        run: |
          # 1. Create a clean temporary staging area outside of our source
          mkdir -p ../staging_assets
          
          # 2. Copy ALL files from your main branch into the staging area
          # This safely isolates your files so no loops can happen
          cp -R * ../staging_assets/ 2>/dev/null || true
          
          # 3. Create the final deployment directory
          mkdir -p _final_site
          
          # 4. Copy the staging assets to the root (handles your main website)
          cp -R ../staging_assets/* _final_site/
          
          # 5. Create folders 1 to 50 and copy the complete asset suite into every single one
          for i in {1..50}; do
            mkdir -p "_final_site/$i"
            cp -R ../staging_assets/* "_final_site/$i/"
          done

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_final_site'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
